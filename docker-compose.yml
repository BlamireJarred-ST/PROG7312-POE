services:
  smartx-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartx-api
    ports:
      - "8080:8080"
    environment:
      # Development enables Swagger UI at http://localhost:8080/swagger
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    restart: unless-stopped
